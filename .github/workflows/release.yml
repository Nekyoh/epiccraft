name: Release

# Roda quando você manda uma tag começando com "v" (ex.: git push origin v0.1.0)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Pegar a versão da tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compilar o mod
        run: |
          # Funciona tanto com o projeto na raiz do repositório quanto dentro da pasta "epiccraft"
          if [ ! -f ./gradlew ] && [ -f ./epiccraft/gradlew ]; then cd epiccraft; fi
          chmod +x ./gradlew
          # -Dorg.gradle.java.home ignora o caminho do Windows que está no gradle.properties
          # -Pmod_version usa a versão da tag (v0.1.0 -> 0.1.0)
          ./gradlew build --no-daemon \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -Pmod_version=${{ steps.version.outputs.version }}

      - name: Criar release (rascunho)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Epic Craft ${{ steps.version.outputs.version }}
          prerelease: ${{ startsWith(steps.version.outputs.version, '0.') }}
          generate_release_notes: true
          files: |
            **/build/libs/*.jar
